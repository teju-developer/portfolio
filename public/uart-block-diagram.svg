<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>
    <linearGradient id="fifoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="520" />
    <line x1="150" y1="0" x2="150" y2="520" />
    <line x1="250" y1="0" x2="250" y2="520" />
    <line x1="350" y1="0" x2="350" y2="520" />
    <line x1="450" y1="0" x2="450" y2="520" />
    <line x1="550" y1="0" x2="550" y2="520" />
    <line x1="650" y1="0" x2="650" y2="520" />
    <line x1="750" y1="0" x2="750" y2="520" />
    <line x1="850" y1="0" x2="850" y2="520" />
    <line x1="0" y1="70" x2="900" y2="70" />
    <line x1="0" y1="170" x2="900" y2="170" />
    <line x1="0" y1="270" x2="900" y2="270" />
    <line x1="0" y1="370" x2="900" y2="370" />
    <line x1="0" y1="470" x2="900" y2="470" />
  </g>

  <!-- Header Section -->
  <text x="450" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">UART CONTROLLER TOP ARCHITECTURE (VERILOG HDL)</text>
  <text x="450" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">50 MHz System Clock | 115200 Baud | 16x Oversampling | 16-Deep FIFO Buffers | Error Detection</text>

  <!-- CLK / RST inputs -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="130" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
    <text x="65" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CLK &amp; RST_N</text>
    <text x="65" y="38" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">clk (50MHz), rst_n</text>
  </g>

  <!-- Baud Rate Generator -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="190" height="65" rx="8" fill="url(#blockGrad)" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="95" y="24" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Baud Rate Generator</text>
    <text x="95" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Modulo-27 Divider</text>
    <text x="95" y="56" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">s_tick (16x Baud Pulse)</text>
  </g>

  <!-- Connection: CLK to Baud Gen -->
  <path d="M 170 115 L 220 115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)" />

  <!-- TRANSMIT PATH (TOP) -->
  <rect x="30" y="175" width="840" height="150" rx="10" fill="#0a101f" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="45" y="196" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">TRANSMITTER PATH (TX)</text>

  <!-- CPU Bus Input -->
  <g transform="translate(50, 215)">
    <rect x="0" y="0" width="120" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <text x="60" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Host Interface</text>
    <text x="60" y="48" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">tx_data [7:0]</text>
    <text x="60" y="65" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">wr_en, clk</text>
  </g>

  <!-- TX FIFO -->
  <g transform="translate(220, 215)">
    <rect x="0" y="0" width="160" height="85" rx="8" fill="url(#fifoGrad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="80" y="28" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TX FIFO Buffer</text>
    <text x="80" y="48" fill="#e9d5ff" font-family="monospace" font-size="10" text-anchor="middle">16 x 8-bit RAM</text>
    <text x="80" y="68" fill="#a855f7" font-family="monospace" font-size="9" text-anchor="middle">flags: empty, full</text>
  </g>

  <!-- Arrow Host to TX FIFO -->
  <path d="M 170 257 L 220 257" stroke="#38bdf8" stroke-width="2" />
  <polygon points="218,252 226,257 218,262" fill="#38bdf8" />

  <!-- TX FSM Controller -->
  <g transform="translate(430, 215)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="url(#blockGrad)" stroke="#00f0ff" stroke-width="1.5" />
    <text x="90" y="28" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TX FSM Controller</text>
    <text x="90" y="46" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">IDLE -&gt; START -&gt; DATA</text>
    <text x="90" y="62" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">-&gt; PARITY -&gt; STOP</text>
  </g>

  <!-- Arrow TX FIFO to TX FSM -->
  <path d="M 380 257 L 430 257" stroke="#a855f7" stroke-width="2" />
  <polygon points="428,252 436,257 428,262" fill="#a855f7" />

  <!-- Parity Generator & Serializer -->
  <g transform="translate(660, 215)">
    <rect x="0" y="0" width="160" height="85" rx="8" fill="url(#blockGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TX Shift Reg &amp; Parity</text>
    <text x="80" y="48" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">PISO Serializer</text>
    <text x="80" y="68" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">Serial Output: TXD</text>
  </g>

  <!-- Arrow TX FSM to Shift Reg -->
  <path d="M 610 257 L 660 257" stroke="#00f0ff" stroke-width="2" />
  <polygon points="658,252 666,257 658,262" fill="#00f0ff" />

  <!-- Serial TX Out Pin -->
  <circle cx="850" cy="257" r="7" fill="#10b981" filter="url(#neonGlow)" />
  <text x="850" y="280" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TXD</text>
  <path d="M 820 257 L 843 257" stroke="#10b981" stroke-width="2" />

  <!-- RECEIVE PATH (BOTTOM) -->
  <rect x="30" y="340" width="840" height="155" rx="10" fill="#0a101f" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
  <text x="45" y="361" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">RECEIVER PATH (RX) - 16x OVERSAMPLING &amp; ERROR DETECTION</text>

  <!-- Serial RX In Pin -->
  <circle cx="50" cy="425" r="7" fill="#00f0ff" filter="url(#neonGlow)" />
  <text x="50" y="448" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">RXD</text>

  <!-- RX 16x Sampler & Deserializer -->
  <g transform="translate(100, 385)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="url(#blockGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">16x Oversampler</text>
    <text x="90" y="48" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Mid-Bit Sample (Tick 7)</text>
    <text x="90" y="68" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">SIPO Shift Register</text>
  </g>

  <!-- Arrow RX In to Sampler -->
  <path d="M 57 425 L 100 425" stroke="#00f0ff" stroke-width="2" />
  <polygon points="98,420 106,425 98,430" fill="#00f0ff" />

  <!-- RX FSM Controller -->
  <g transform="translate(330, 385)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="url(#blockGrad)" stroke="#00f0ff" stroke-width="1.5" />
    <text x="90" y="28" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RX FSM Controller</text>
    <text x="90" y="46" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Start Bit Detect</text>
    <text x="90" y="62" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">8-Bit Data Assembly</text>
  </g>

  <!-- Arrow Sampler to RX FSM -->
  <path d="M 280 425 L 330 425" stroke="#38bdf8" stroke-width="2" />
  <polygon points="328,420 336,425 328,430" fill="#38bdf8" />

  <!-- Error Detection Unit (Parity & Framing) -->
  <g transform="translate(560, 385)">
    <rect x="0" y="0" width="140" height="85" rx="8" fill="#1b1329" stroke="#ef4444" stroke-width="1.3" />
    <text x="70" y="26" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Error Checker</text>
    <text x="70" y="44" fill="#fca5a5" font-family="monospace" font-size="9" text-anchor="middle">Parity Error [PE]</text>
    <text x="70" y="60" fill="#fca5a5" font-family="monospace" font-size="9" text-anchor="middle">Frame Error [FE]</text>
    <text x="70" y="74" fill="#4ade80" font-family="monospace" font-size="9" text-anchor="middle">Zero Failures</text>
  </g>

  <!-- Arrow RX FSM to Error Checker -->
  <path d="M 510 425 L 560 425" stroke="#00f0ff" stroke-width="2" />
  <polygon points="558,420 566,425 558,430" fill="#00f0ff" />

  <!-- RX FIFO -->
  <g transform="translate(730, 385)">
    <rect x="0" y="0" width="130" height="85" rx="8" fill="url(#fifoGrad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="65" y="28" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RX FIFO Buffer</text>
    <text x="65" y="48" fill="#e9d5ff" font-family="monospace" font-size="10" text-anchor="middle">16 x 8-bit RAM</text>
    <text x="65" y="68" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">rx_data out</text>
  </g>

  <!-- Arrow Error Checker to RX FIFO -->
  <path d="M 700 425 L 730 425" stroke="#a855f7" stroke-width="2" />
  <polygon points="728,420 736,425 728,430" fill="#a855f7" />

  <!-- Baud tick distribution lines -->
  <path d="M 315 155 L 315 175" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
  <path d="M 315 155 L 520 155 L 520 215" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
  <path d="M 315 155 L 190 155 L 190 385" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>