<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Pins Left -->
  <line x1="4" y1="18" x2="14" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="26" x2="14" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="34" x2="14" y2="34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="42" x2="14" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="50" x2="14" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Pins Right -->
  <line x1="50" y1="18" x2="60" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="26" x2="60" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="34" x2="60" y2="34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="42" x2="60" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="50" x2="60" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Chip Body -->
  <rect x="14" y="10" width="36" height="44" rx="4" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Silicon Die Core -->
  <rect x="22" y="18" width="20" height="28" rx="2" fill="#030712" stroke="#00f0ff" stroke-width="1" filter="url(#glow)" />
  <!-- Die Pattern & Monogram -->
  <path d="M25 24h14M25 28h14M25 32h14M25 36h14" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.4" />
  <text x="32" y="36" fill="#00f0ff" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">TS</text>
  <!-- Pin 1 Dot -->
  <circle cx="18" cy="15" r="1.5" fill="#00f0ff" />
</svg>